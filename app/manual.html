<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>手册编辑器</title>
<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

</style></head><body>

  <span class="sp"></span><button id="print">打印 / 另存为 PDF</button><button id="save" class="on">保存到项目</button><a id="back" href="index.html" style="color:var(--mut)">返回</a></div>

    <h3>和材料清单核对</h3><div id="chk"></div></div>

  </div>
</div>
<div id="msg"></div>

function pointsOf(key){if(!PT[key]){const it=MM.item(lib,key),out=[];PT[key]=out;if(it&&it.node!=null){const {c}=bare(it);c.updateMatrixWorld(true);const hs=[];

  sr.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture|network/.test(e.error)){micOn=false;edUI();say(e.error==='audio-capture'?'没有找到麦克风。':e.error==='network'?'浏览器的语音识别连不上，请直接打字。':'浏览器没有允许使用麦克风：请在地址栏旁边允许后再试。',true)}};
  sr.onend=()=>{if(!micOn)return;if(Date.now()-t0<400&&++srFast>4){micOn=false;edUI();say('语音识别一直启动不了，请直接打字。',true);return}if(Date.now()-t0>=400)srFast=0;setTimeout(micStart,150)};try{sr.start()}catch(e){}}
function micToggle(){if(!SR){say('这个浏览器没有语音识别，请直接打字，效果一样。',true);return}if(cur>=0&&$('sText'))man.steps[cur].text=$('sText').value;micOn=!micOn;if(micOn){srFast=0;micStart();say('正在听。说明：浏览器自带的语音识别会把声音发给浏览器厂商（Chrome 是谷歌）转成文字，这里不保存录音。',true)}else{try{sr&&sr.abort()}catch(e){}}edUI()}
/* ================= saving ================= */
const dlf=(name,text,type)=>{const a=el('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});document.body.append(a);a.click();a.remove()};
$('mTitle').onchange=e=>{man.title=e.target.value.trim();dirty=true};
$('print').onclick=()=>{if(!man.steps.some(s=>s.ok)){say('还没有确认过的步骤，没有可打印的内容。');return}const w=window.open('','_blank');if(!w){dlf('装配手册.html',MM.printHTML(man,lib),'text/html');say('浏览器拦住了新窗口，已改为下载手册文件，打开后可以打印。',true);return}w.document.write(MM.printHTML(man,lib));w.document.close();setTimeout(()=>{try{w.print()}catch(e){}},400)};
$('save').onclick=async()=>{if(cur>=0&&$('sText'))man.steps[cur].text=$('sText').value;const R=MM.check(man.steps,lib,placedNow()),js=JSON.stringify(man,null,1);if(!pid){dlf('manual.json',js,'application/json');say('这份手册不是从项目里打开的，已改为下载 manual.json。');dirty=false;return}
  try{await DB.put(pid,'pkg/manual/manual.json',js);await DB.put(pid,'pkg/manual/manual.html',MM.printHTML(man,lib));await DB.put(pid,'pkg/manual/steps.from-manual.json',JSON.stringify(MM.toDraft(man.steps,lib),null,1));dirty=false;say('已保存到项目的 manual 文件夹：手册数据、可打印的手册、给平台用的步骤数据。'+(R.done?'':'注意：'+(R.todo?'还有 '+R.todo+' 步没确认；':'')+(R.over.length?'有零件超出清单；':'')+(R.under.length?'清单里还有零件没用完。':'')),true)}catch(e){say('保存失败：'+(e.message||e),true)}};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
/* ================= loading ================= */
async function start(text,rows,saved,where,title){try{M=JSON.parse(text);if(M.format!=='assembly-model')throw new Error('这不是模型数据文件')}catch(e){$('err').textContent='打不开零件的三维数据：'+(e.message||e);return}
  P=new ModelPlayer(THREE,M);await P.ready;M.scenes.forEach((S,k)=>{const st=[...M.steps].reverse().find(s=>s.scene===k);if(st)P.pose(st.id,1)});lib=MM.library(M,rows);lib.forEach(it=>it.nodes.forEach(n=>roots.set(it.scene+':'+n,it.key)));
  if(saved&&saved.format==='assembly-manual')man=saved;if(!man.title)man.title=title||((M.product||'')+' 装配手册');$('mTitle').value=man.title;$('ttl').textContent=where+' · '+lib.length+' 种零件';size();const f=lib.find(x=>x.node!=null);if(f)showItem(f.key);cur=man.steps.length?0:-1;stepsUI();edUI();requestAnimationFrame(loop)}
if(pid)$('back').href='project.html?id='+encodeURIComponent(pid);else $('save').textContent='下载 manual.json';
window.__man={insts:()=>insts.map(o=>({key:o.key,loose:o.loose,fast:!!o.fast,p:o.H.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2))})),instPoint:(key,name,k)=>{const o=insts.filter(x=>x.key===key&&!x.fast)[k||0],pt=pointsOf(key).find(p=>p.name===name);draw();const w=o.c.localToWorld(new THREE.Vector3(...pt.p));const v=w.clone().project(cam),r=ren.domElement.getBoundingClientRect();return{w:w.toArray().map(x=>+x.toFixed(2)),x:r.left+(v.x+1)/2*r.width,y:r.top+(1-v.y)/2*r.height}},surf:(key)=>{const o=view.mode==='state'?insts.find(x=>x.key===key).c:holder.children[0];draw();const b=new THREE.Box3().setFromObject(o),c=b.getCenter(new THREE.Vector3());const v=c.project(cam),r=ren.domElement.getBoundingClientRect();return{x:r.left+(v.x+1)/2*r.width,y:r.top+(1-v.y)/2*r.height}},turn:(az,el)=>{view.az=az;view.el=el;draw()},state:()=>({ready:!!P,cur,steps:man.steps.length,grab:grab&&{key:grab.key,pt:grab.pt&&grab.pt.name},pick:pickT,view:view.mode,key:view.key,dirty}),man:()=>man,lib:()=>lib.map(x=>({key:x.key,name:x.name,qty:x.qty,hw:x.hw,has:x.node!=null})),points:k=>pointsOf(k),show:k=>showItem(k),
  screen:(key,name)=>{const pt=pointsOf(key).find(p=>p.name===name),m=marks.find(x=>x.userData.pt===pt);draw();const v=(m?m.getWorldPosition(new THREE.Vector3()):view.ct.clone()).project(cam),r=ren.domElement.getBoundingClientRect();return{x:r.left+(v.x+1)/2*r.width,y:r.top+(1-v.y)/2*r.height}},
  partScreen:key=>{const it=lib.find(x=>x.key===key),o=P.node(it.scene,it.node);draw();const v=new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).project(cam),r=ren.domElement.getBoundingClientRect();return{x:r.left+(v.x+1)/2*r.width,y:r.top+(1-v.y)/2*r.height}},mateGap:()=>mate?mate.children.length:0};
try{if(pid&&typeof DB!=='undefined'){const f=await DB.file(pid,'pkg/model/model.json');if(!f)throw new Error('这个项目还没有零件的三维数据。请先在项目页的“模型编辑器”里点“生成数据模型”。');let rows=null,saved=null,title='';try{const pf=await DB.file(pid,'pkg/package.json'),pk=pf&&JSON.parse(dec(pf.data)),pp=pk&&pk.files&&pk.files.parts,cf=pp&&await DB.file(pid,'pkg/'+pp);if(cf)rows=MEdit.csvParse(dec(cf.data));if(pk&&pk.name)title=pk.name+' 装配手册';const mf=await DB.file(pid,'pkg/manual/manual.json');if(mf)saved=JSON.parse(dec(mf.data))}catch(e){}await start(dec(f.data),rows,saved,'项目里的零件和材料清单',title)}
  else if(src){const r=await fetch(src);if(!r.ok)throw new Error('读取 '+src+' 失败（'+r.status+'）');let rows=null;const pc=qs.get('parts');if(pc){try{const c=await fetch(pc);if(c.ok)rows=MEdit.csvParse(await c.text())}catch(e){}}await start(await r.text(),rows,null,src)}
  else $('err').textContent='没有指定零件数据。请从项目页的“手册编辑器”进入。'}catch(e){$('err').textContent=e.message||String(e)}
})();
