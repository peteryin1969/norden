<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<style>

</style></head><body>

  <span class="sp"></span><button id="print">打印 / 另存为 PDF</button><button id="save" class="on">保存到项目</button><a id="back" href="index.html" style="color:var(--mut)">返回</a></div>

    <h3>和材料清单核对</h3><div id="chk"></div>

  <div class="col" id="ed"></div>
  <div class="col" id="benchCol">
    <div class="row"><h2 style="margin:0">零件台</h2><button id="vState" class="sm" title="按目前的步骤，现在装成了什么样">装配状态</button><button id="vAll" class="sm" title="装好后的成品">看成品</button><button id="bMark" class="sm" title="在零件表面任意位置加一个孔位标记，给没有孔位数据的零件用">加标记点</button><label class="mut"><input type="checkbox" id="vPts"> 显示角、边、面的点</label></div>
    <div class="mut">点零件名，把它加进当前这一步：</div><div id="lib"></div>
    <div id="bench"><div id="bcap"></div><div id="lbls"></div><div id="tip"></div></div>

  </div>
</div>

let M=null,P=null,lib=[],man={format:'assembly-manual',version:2,title:'',steps:[],marks:{},rules:{p1:true,p2:true,more:''}},cur=-1,dirty=false,grab=null,pickT=null,busy=false,micOn=false,sr=null;
/* ================= the bench ================= */

const size=()=>{const w=bench.clientWidth,h=bench.clientHeight;if(!w)return;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};addEventListener('resize',size);

/* how a part is turned when shown: in the product's design position (main parts are stored in that frame; a part fixed onto another keeps its place on it) */
function qOf(it){const N=M.scenes[it.scene].nodes,ch=[],q=new THREE.Quaternion();for(let i=it.node;i>=0;i=N[i].p)ch.push(i);ch.reverse().forEach(i=>{const k=roots.get(it.scene+':'+i),g=k&&MM.item(lib,k).group;if(!g)q.multiply(P.node(it.scene,i).quaternion)});return q}

  (M.holes||[]).filter(h=>h.scene===it.scene).forEach(h=>{let o=null;c.traverse(x=>{if(x.userData.node===h.node)o=x});if(!o)return;const p=o.getWorldPosition(new THREE.Vector3()),n=new THREE.Vector3(0,0,1).applyQuaternion(o.getWorldQuaternion(new THREE.Quaternion()));if(hs.some(x=>x.p.distanceTo(p)<.05))return;o.geometry.computeBoundingBox();const gb=o.geometry.boundingBox,ws=o.getWorldScale(new THREE.Vector3());hs.push({p,n,r:+((gb.max.x-gb.min.x)/2*Math.abs(ws.x)).toFixed(3)})});

    for(const i of[0,2])for(const j of[0,2])for(const k of[0,2])out.push({kind:'corner',i:++nc,name:'角'+nc,p:at(i,j,k)});

function marker(pt,r,H,key){const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),new THREE.MeshBasicMaterial({color:COL[pt.kind],depthTest:false,transparent:true,opacity:.92}));m.renderOrder=9;m.position.fromArray(pt.p);m.userData.pt=pt;m.userData.key=key;H.add(m);

function showItem(key,keepView){const it=MM.item(lib,key);view.mode='one';view.key=key;clearBench();modeUI();if(!it||it.node==null){$('bcap').textContent=(it?it.name:'')+'：这个零件还没有三维图';libUI();return}

  turn:(az,el)=>{view.az=az;view.el=el;draw()},surf:key=>{const o=view.mode==='state'?insts.find(x=>x.key===key).c:holder.children[0];draw();const b=new THREE.Box3().setFromObject(o),c=b.getCenter(new THREE.Vector3()),v=c.project(cam),r=ren.domElement.getBoundingClientRect();return{x:r.left+(v.x+1)/2*r.width,y:r.top+(1-v.y)/2*r.height}}};
