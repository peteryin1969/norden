<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>装配平台审核</title><style>:root{--bg:#f4f5f2;--ink:#17201c;--mut:#5d6a63;--c:#fff;--ln:#dfe3dd;--ac:#25624b;--ok:#2f7d4f;--okb:#e5f4e4;--bad:#b3261e;--badb:#fbebeb;--wn:#8a5a00;--wnb:#f9eeda;--td:#2b5f9e;--tdb:#e7f1fb}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--ink:#e9ede9;--mut:#a3aea7;--c:#1e2420;--ln:#2e3631;--ac:#7fcfae;--ok:#7fd49c;--okb:#1e3326;--bad:#ff8a80;--badb:#3a2020;--wn:#f0c36a;--wnb:#3a3020;--td:#8cbcf2;--tdb:#1d2b3d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
a{color:var(--ac)}h1{font-size:24px;margin:6px 0 2px}h2{font-size:19px;margin:28px 0 8px}h3{font-size:16px;margin:16px 0 6px}.mut{color:var(--mut)}.card{background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:10px 0}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}.pipe a{display:block;text-decoration:none;color:inherit;background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:10px}.pipe b{display:block;font-size:13px;color:var(--mut);font-weight:500}
.g{display:inline-block;font-weight:600;font-size:13px;padding:1px 9px;border-radius:11px}.g.通过{background:var(--okb);color:var(--ok)}.g.退回补充{background:var(--badb);color:var(--bad)}.g.待客户确认{background:var(--tdb);color:var(--td)}.pre{font-size:12px;color:var(--mut);margin-left:4px}
.ck{border-left:4px solid var(--ln);padding:8px 10px;margin:8px 0;background:var(--c);border-radius:0 8px 8px 0}.ck.fail{border-color:var(--bad)}.ck.pass{border-color:var(--ok)}.ck.warn{border-color:var(--wn)}.ck.todo{border-color:var(--td)}.ck.na{border-color:var(--ln)}
.ck .t{font-weight:600}.st{font-size:12px;font-weight:600;margin-right:6px}.st.fail{color:var(--bad)}.st.pass{color:var(--ok)}.st.warn{color:var(--wn)}.st.todo{color:var(--td)}.st.na{color:var(--mut)}.lv{font-size:12px;color:var(--mut)}
.ck dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.ck dt{color:var(--mut);font-size:13px}.ck dd{margin:0}
details>summary{cursor:pointer;color:var(--ac)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--ln);padding:4px 6px;text-align:left;vertical-align:top}tr.bad td{color:var(--bad)}
.q{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start}.q img{width:110px;border-radius:6px;border:1px solid var(--ln);background:#fff}.q .k{font-size:12px;color:var(--mut)}.ans{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer}button.on{background:var(--ac);color:var(--c)}button.iss.on{background:var(--bad);border-color:var(--bad)}
input[type=text],textarea{font:inherit;width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:inherit}
.sb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sb img{width:100%;border-radius:6px;border:1px solid var(--ln);background:#fff;cursor:zoom-in}.sb .cap{font-size:11px;color:var(--mut);text-align:center}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--ln);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9}.zoom img{max-width:96vw;max-height:92vh;background:#fff;border-radius:6px}
@media (max-width:560px){.sb{grid-template-columns:repeat(2,1fr)}.q{grid-template-columns:80px 1fr}.q img{width:80px}}.pipe div{background:var(--bg);border-radius:8px;padding:6px 8px}</style></head><body><main></main><script>document.querySelector('main').innerHTML=`<p><a href="../">‹ 组装助手</a></p><h1>装配助手制作平台 · 审核</h1><p class="mut">入口 A（客户已有装配方案），阶段 1–3。第一个是用 NORDEN 数据补齐的模拟资料包，用来演示全部通过的流程；其余四个是按我们手上真实资料审核的结果。IKEA 产品只用于内部测试。</p><a class="card" style="display:block;text-decoration:none;color:inherit" href="norden-sim/"><b style="font-size:17px">NORDEN 折叠桌（模拟资料包）</b><div class="pipe" style="margin:8px 0 0"><div><b>阶段 1</b><span class="g 通过">通过</span></div><div><b>阶段 2</b><span class="g 通过">通过</span></div><div><b>阶段 3</b><span class="g 待客户确认">待客户确认</span></div><div><b>阶段 4</b><span class="g 通过">通过</span></div><div><b>阶段 5</b><span class="g 待客户确认">待客户确认</span></div></div></a><a class="card" style="display:block;text-decoration:none;color:inherit" href="norden/"><b style="font-size:17px">IKEA NORDEN 折叠桌</b><div class="pipe" style="margin:8px 0 0"><div><b>阶段 1</b><span class="g 退回补充">退回补充</span></div><div><b>阶段 2</b><span class="g 待客户确认">待客户确认</span><span class=pre>预审</span></div><div><b>阶段 3</b><span class="g 待客户确认">待客户确认</span><span class=pre>预审</span></div></div></a><a class="card" style="display:block;text-decoration:none;color:inherit" href="storklinta/"><b style="font-size:17px">IKEA STORKLINTA 六斗柜</b><div class="pipe" style="margin:8px 0 0"><div><b>阶段 1</b><span class="g 退回补充">退回补充</span></div><div><b>阶段 2</b><span class="g 待客户确认">待客户确认</span><span class=pre>预审</span></div><div><b>阶段 3</b><span class="g 退回补充">退回补充</span><span class=pre>预审</span></div></div></a><a class="card" style="display:block;text-decoration:none;color:inherit" href="billy-corner/"><b style="font-size:17px">IKEA BILLY 转角书柜</b><div class="pipe" style="margin:8px 0 0"><div><b>阶段 1</b><span class="g 退回补充">退回补充</span></div><div><b>阶段 2</b><span class="g 待客户确认">待客户确认</span><span class=pre>预审</span></div><div><b>阶段 3</b><span class="g 退回补充">退回补充</span><span class=pre>预审</span></div></div></a><a class="card" style="display:block;text-decoration:none;color:inherit" href="billy-oxberg/"><b style="font-size:17px">IKEA BILLY OXBERG 书柜</b><div class="pipe" style="margin:8px 0 0"><div><b>阶段 1</b><span class="g 退回补充">退回补充</span></div><div><b>阶段 2</b><span class="g 待客户确认">待客户确认</span><span class=pre>预审</span></div><div><b>阶段 3</b><span class="g 退回补充">退回补充</span><span class=pre>预审</span></div></div></a>
<div class="card"><b>怎么用</b><ol style="margin:6px 0 0;padding-left:20px"><li>每个产品页列出各阶段的检查结果；不通过的项写明缺什么、为什么需要、怎么补。</li><li>阶段 2 的待确认问题和阶段 3 的分镜，在页面上逐条确认或更正，再导出 answers.json、signoff.json 交回平台。</li><li>平台重新审核后，这里的结果会更新。</li></ol></div>`</script></body></html>
