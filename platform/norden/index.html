  if(s.stage===5){if(s.qr)sec.append($('h3',{},'二维码'),$('div',{class:'card',style:'display:flex;gap:14px;align-items:center;flex-wrap:wrap'},$('img',{src:s.qr,alt:'二维码',style:'width:140px;height:140px;background:#fff;border-radius:6px'}),$('div',{},'印在：'+(s.qr_location||'')+'。',$('br'),$('a',{href:s.url},s.url))));
    if(s.photo_cases&&s.photo_cases.length){const log=$('span',{class:'mut'}),b=$('button',{onclick:e=>runPH(e.target,log)},APH&&APH.cases?'重新运行拍照检查测试':'运行拍照检查测试');sec.append($('h3',{},'拍照检查测试'),$('div',{class:'card'},$('div',{class:'mut'},'挑 '+s.photo_cases.length+' 步，每步拿“装好了”和“没装好”两张图（用渲染图代替照片）给 AI 判断，看它能不能分辨。'),keyBox()||$('div',{class:'ans'},b,log,APH&&APH.cases?$('button',{onclick:()=>dl('ai_photo.json',APH)},'导出结果'):''),APH&&APH.cases?$('div',{style:'margin-top:6px;font-size:13px'},APH.cases.map(x=>'第 '+x.step+' 步'+x.kind+'：应'+(x.expect==='pass'?'通过':'不通过')+'，AI 判'+({pass:'通过',fail:'不通过',unsure:'看不清'}[x.got]||x.got)+(x.say?'（'+x.say+'）':'')).join('；')):''))}}

async function b64(url){const r=await fetch(url);if(!r.ok)throw new Error('读不到图片 '+url);const b=await r.blob();return await new Promise(ok=>{const f=new FileReader();f.onload=()=>ok({type:'image',source:{type:'base64',media_type:b.type||'image/png',data:f.result.split(',')[1]}});f.readAsDataURL(b)})}
function getKey(){let k='';try{k=localStorage.getItem('norden-key')||''}catch(e){}return k}
async function claude(content,max=900){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:max,messages:[{role:'user',content}]})});if(!r.ok)throw new Error('AI 服务返回 '+r.status+' '+(await r.text()).slice(0,160));const j=await r.json();return (j.content||[]).map(x=>x.text||'').join('')}
/* the AI's JSON is read tolerantly: quotes inside a sentence or a cut-off reply must not stop the review */
const pj=t=>{const m=t.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}const is=[];const re=/"severity"\s*:\s*"(严重|一般|轻微)"\s*,\s*"text"\s*:\s*"([\s\S]*?)"\s*\}\s*(?=,|\]|$)/g;let x;while((x=re.exec(t)))is.push({severity:x[1],text:x[2].replace(/\\"/g,'"')});if(is.length||/"issues"\s*:\s*\[\s*\]/.test(t))return{issues:is};const v=t.match(/"verdict"\s*:\s*"(pass|fail|unsure)"/);if(v){const sy=t.match(/"say"\s*:\s*"([\s\S]*?)"\s*\}?\s*$/);return{verdict:v[1],say:sy?sy[1]:''}}return null};
function keyBox(){const box=$('div',{class:'card'});if(getKey())return null;const inp=$('input',{type:'text',placeholder:'粘贴你的 Claude API key（只存在这台设备上）'});box.append($('div',{},'这一步要调用 AI，需要你的 Claude API key。在装配助手里设过的，这里会自动用上。'),inp,$('div',{class:'ans'},$('button',{onclick:()=>{try{localStorage.setItem('norden-key',inp.value.trim())}catch(e){}location.reload()}},'保存')));return box}
async function runAI3(btn,log){const s3=S.find(s=>s.stage===3);const part=LS.get('ai3part'),out={model:'claude-sonnet-5-5',by:'独立 AI（未参与制作）',time:new Date().toISOString(),steps:part.steps||{}};btn.disabled=true;
  for(const f of s3.frames){if(out.steps[f.id])continue;log.textContent='审核第 '+f.id+' 步…';const st=R.steps.find(x=>x.id===f.id)||{do:[],parts:[]};try{const imgs=[await b64(img(f.id)),...await Promise.all(f.frames.map(b64))];
    const txt='你是独立审核员，没有参与制作这个装配动画，也没看过别人的审核结论。第一张图是说明书第 '+f.id+' 步原图，后三张是动画这一步的开始、中间、结束截图。\n步骤文字：'+st.do.join('')+'\n零件：'+st.parts.map(p=>p[0]+' × '+p[1]).join('，')+'\n按清单检查：零件种类和数量是否和说明书一致；朝向（正反、上下、左右、内外）是否一致；安装顺序；拧转或敲击方式；标签是否指着对应的零件。动画是示意图，比例和材质不同不算问题。只报告从图里确实看得出的问题，看不清的不要猜。严重=会让用户装错或有安全风险；一般=容易误解；轻微=细节。\n只输出 JSON，text 里不要用双引号：{"issues":[{"severity":"严重|一般|轻微","text":"…"}]}';
    let j=pj(await claude([...imgs,{type:'text',text:txt}],1500));if(!j)j=pj(await claude([...imgs,{type:'text',text:txt+'\n注意：text 里不要用双引号。'}],1500));out.steps[f.id]=j||{issues:[{severity:'一般',text:'这一步 AI 的回复读不出来，请重新运行或人工看一下'}]};LS.set('ai3part',out)}catch(e){log.textContent='第 '+f.id+' 步出错（已完成的步骤保留，再点一次从这一步继续）：'+e.message;btn.disabled=false;return}}
  LS.set('ai3part',{});LS.set('ai3',out);log.textContent='完成。';location.reload()}
async function runPH(btn,log){const s5=S.find(s=>s.stage===5),s3=S.find(s=>s.stage===3);const cases=[];btn.disabled=true;
  for(const c of s5.photo_cases){const f=s3.frames.find(x=>x.id===c.step);const st=R.steps.find(x=>x.id===c.step);for(const [kind,fr,expect] of [['装好了',f.frames[2],'pass'],['没装好',f.frames[0],'fail']]){log.textContent='第 '+c.step+' 步：'+kind+'…';
    try{const t='你在帮用户检查装配。第一张是说明书第 '+c.step+' 步原图，第二张是用户拍的照片（这里用渲染图代替）。这一步要做：'+st.do.join('')+'\n判断照片里这一步是否已经装好、装对。只输出 JSON：{"verdict":"pass|fail|unsure","say":"一句话"}';
      const j=pj(await claude([await b64(img(c.step)),await b64(fr),{type:'text',text:t}],300))||{};cases.push({step:c.step,kind,expect,got:j.verdict||'unsure',say:j.say||''})}catch(e){log.textContent='出错：'+e.message;btn.disabled=false;return}}}
  LS.set('aiph',{model:'claude-sonnet-5-5',time:new Date().toISOString(),cases});log.textContent='完成。';location.reload()}
(()=>{const s3=document.getElementById('s3');if(s3){const st=S.find(s=>s.stage===3);const log=$('span',{class:'mut'}),b=$('button',{onclick:e=>runAI3(e.target,log)},AI3&&AI3.steps?'重新运行独立 AI 审核':'运行独立 AI 审核');const k=keyBox();s3.querySelector('h3')&&s3.insertBefore($('div',{class:'card'},$('b',{},'独立 AI 审核'),$('div',{class:'mut'},'用你的 Claude key，让一个没参与制作的 AI 逐步对照说明书原图和分镜图找错。'+st.frames.length+' 步，每步一次调用。'),k||$('div',{class:'ans'},b,log,AI3&&AI3.steps?$('button',{onclick:()=>dl('ai_review.json',AI3)},'导出结果'):'')),s3.querySelector('h3'));
    if(AI3&&AI3.steps)s3.querySelectorAll('.card').forEach(cd=>{const t=cd.firstChild&&cd.firstChild.textContent||'';const m=t.match(/^第 (\S+) 步/);if(m&&AI3.steps[m[1]]){const is=AI3.steps[m[1]].issues||[];cd.insertBefore($('div',{style:'font-size:13px;margin:4px 0'},is.length?is.map(x=>'AI（'+x.severity+'）：'+x.text).join('；'):'AI：没有发现问题'),cd.children[2]||null)}})}})();
const pg=$('span',{class:'mut'});const bar=$('div',{class:'bar'},$('button',{onclick:()=>dl('answers.json',LS.get('ans'))},'导出答案'),$('button',{onclick:()=>dl('signoff.json',LS.get('sign'))},'导出分镜确认'),pg);main.append(bar);
function prog(){const s2=S.find(s=>s.stage===2),s3=S.find(s=>s.stage===3),a=LS.get('ans'),g=LS.get('sign');pg.textContent='问题已答 '+(s2?s2.questions.filter(q=>a[q.id]&&a[q.id].status).length+'/'+s2.questions.length:'-')+'，分镜已确认 '+(s3?s3.frames.filter(f=>g[f.id]&&g[f.id].status).length+'/'+s3.frames.length:'-')}prog();
