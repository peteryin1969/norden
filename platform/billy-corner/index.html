/* the AI's JSON is read tolerantly: quotes inside a sentence or a cut-off reply must not stop the review */
const pj=t=>{const m=t.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}const is=[];const re=/"severity"\s*:\s*"(严重|一般|轻微)"\s*,\s*"text"\s*:\s*"([\s\S]*?)"\s*\}\s*(?=,|\]|$)/g;let x;while((x=re.exec(t)))is.push({severity:x[1],text:x[2].replace(/\\"/g,'"')});if(is.length||/"issues"\s*:\s*\[\s*\]/.test(t))return{issues:is};const v=t.match(/"verdict"\s*:\s*"(pass|fail|unsure)"/);if(v){const sy=t.match(/"say"\s*:\s*"([\s\S]*?)"\s*\}?\s*$/);return{verdict:v[1],say:sy?sy[1]:''}}return null};

  /* only the steps whose animation changed are reviewed again; their old findings and the decisions on them are dropped */if(!all&&AI3&&AI3.steps&&!Object.keys(part.steps||{}).length){const stl=aiStale();Object.entries(AI3.steps).forEach(([k,v])=>{if(!stl.includes(k))out.steps[k]=v});const dx=LS.get('aidisp3');Object.keys(dx).forEach(k=>{if(stl.some(id=>k.startsWith('r:'+id+':')))delete dx[k]});LS.set('aidisp3',dx)}else if(all&&!Object.keys(part.steps||{}).length){const dx=LS.get('aidisp3');Object.keys(dx).forEach(k=>{if(k.startsWith('r:'))delete dx[k]});LS.set('aidisp3',dx)}
